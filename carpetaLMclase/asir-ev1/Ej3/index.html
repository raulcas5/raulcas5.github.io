<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planetas del Sistema Solar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 align="center">Planetas del Sistema Solar</h1>
        <table border="5px"  width="80%" align="center">
            <tr>
                <td>Planeta</td>
                <td>Diámetro (km)</td>
                <td style="width:40%" >Distancia al Sol (millones km)</td>
                <td>Tipo</td>
            </tr>
            <tr>
                <td>Mercurio</td>
                <td>4,879</td>
                <td>57.9</td>
                <th rowspan="3" scope="col">Rocosos</th>
            </tr>
            <tr>
                <td>Venus</td>
                <td>12,104</td>
                <td>108.2</td>
            </tr>
            <tr>
                <td>Tierra</td>
                <td>12,742</td>
                <td>149.6</td>
            </tr>
            <tr>
                <td>Júpiter</td>
                <th colspan="2" scope="col">Planeta más grande del Sistema Solar</th>
                <td>Gaseoso</td>
            </tr>
        </table>
</body>
</html>
