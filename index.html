    <style>
        /* Estilos para la lista de prácticas */
        ul {
            list-style: none; /* Quitamos los puntitos de la lista */
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 15px; /* Espacio entre cada rectángulo */
        }

        /* Transformamos los enlaces en rectángulos con contorno neón */
        ul li a {
            display: block;
            padding: 12px 20px;
            color: #ffffff !important; /* Texto blanco siempre legible */
            text-decoration: none; /* Quitamos el subrayado feo */
            font-family: sans-serif;
            font-weight: bold;
            background-color: rgba(13, 17, 23, 0.8); /* Fondo oscuro semitransparente */
            
            /* Contorno Azul Neón */
            border: 2px solid #00f0ff; 
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.3), inset 0 0 5px rgba(0, 240, 255, 0.2);
            
            /* Transición suave para las animaciones */
            transition: all 0.3s ease-in-out; 
        }

        /* Efecto al pasar el ratón (Hover) */
        ul li a:hover {
            transform: scale(1.06); /* Se hace un 6% más grande */
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.8), inset 0 0 10px rgba(0, 240, 255, 0.4); /* El neón brilla más */
            background-color: rgba(0, 240, 255, 0.1); /* Ligero destello azul de fondo */
            border-color: #00f0ff;
        }

        /* Ajuste estético para la tabla para que no se vea vieja */
        table {
            border-collapse: collapse;
            border: 2px solid #00f0ff !important;
            background-color: rgba(0, 0, 0, 0.5);
            border-radius: 12px;
            overflow: hidden;
        }
        
        td {
            padding: 20px;
        }
    </style>
</head>
